site_name: SIB Training Cookbook
nav:
  - Home: index.md
  - Plan:
    - Identify and assess training needs: plan/training_needs.md
    - Course Programme and Planning: plan/course_programme.md
    - Call for New Courses: plan/call_new_courses.md

  - Design:
    # merge the course design pages below
    - Course Design: design/course_design.md
    - Design the Course: design/design_course.md
    - Types of courses: design/type_course.md
    - Course Description: design/course_description.md

  - Develop:
    - Course material life cycle: develop/course_material.md
    # merge the metadata page with the FAIR page
    - Make course materials open and FAIR: develop/FAIR-training-flowchart/flowchart_description.md
    - Metadata mapping: develop/metadata.md
  - Deliver:
  # course coordination could become one page or less pages
    - Course instance coordination:
      - Open and announce the course: deliver/course_instance_coordination/open_course.md
      - Register Participants: deliver/course_instance_coordination/register_participants.md
      - Manage Payments: deliver/course_instance_coordination/manage_payments.md
      - Send practical information to registered participants: deliver/course_instance_coordination/send_info.md
      - Attendance list and exams: deliver/course_instance_coordination/attendance_exam.md
      - Thank participants: deliver/course_instance_coordination/thank_participants.md
      - Update courseadmin (after course): deliver/course_instance_coordination/after_course.md
      - Certificates: deliver/course_instance_coordination/certificate.md
      - Record Lectures: deliver/course_instance_coordination/record_lectures.md
      - Course Administrative tasks: deliver/course_instance_coordination/admin_tasks.md
      - Reimbursements: deliver/course_instance_coordination/reimbursements.md
      - Course Locations: deliver/course_instance_coordination/course_location.md
    - Setting up for the course day: deliver/course_day_setup.md
    - Delivering the Course: deliver/deliver_course.md
  - Evaluate:
    -  ECTS credits and Exam: evaluate/ECTS_exam.md
    # merge evaluation and feedback
    - Course Evaluation: evaluate/course_evaluation.md
    - Feedback: evaluate/feedback.md
  # E-learning could be combined in one page
  - E-learning:
    - Plan:
      - Identify and assess e-learning needs: elearning/plan/elearning_needs.md
      - E-learning plan: elearning/plan/elearning_plan.md
    - Design:
      - E-learning design: elearning/design/elearning_design.md
    - Develop:
      - E-learning material: elearning/develop/elearning_material.md
      - Make e-learning materials open and FAIR: elearning/develop/elearning_openandFAIR.md
    - Deliver:
      - Course coordination: elearning/deliver/elearning_coordination.md
    - Evaluate:
      - E-learning evaluation: elearning/evaluate/elearning_evaluation.md
  - Glossary: Glossary.md

watch:
  - includes

theme:
  name: material
  logo: assets/images/SIB_logo.svg
  favicon: assets/images/SIB_logo.svg
  features:
    - search.suggest
    - search.highlight
    - search.share
  palette:

    # Palette toggle for light mode
    - scheme: default
      primary: "#D40000"
      accent: "#999999"
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: "#F6D0D0"
      accent: "#999999"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Repository
repo_name: sib-swiss/training-cookbook
repo_url: https://github.com/sib-swiss/training-cookbook
markdown_extensions:
  - abbr
  - def_list
  - footnotes
  - tables
  - admonition
  - codehilite:
      guess_lang: false
  - sane_lists
  - smarty
  - toc
  - pymdownx.superfences
  - attr_list
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      auto_append:
        - includes/definitions.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # git-revision-date-localized is not yet supported by Zensical (Tier 2 / backlog),
  # so it currently has no effect — kept here so it resumes working once Zensical adds support.
  - git-revision-date-localized:
      enable_creation_date: true
  # - git-committers:
  #     repository: sib-swiss/training-cookbook
  #     branch: main
  #     token: !ENV ["CI_JOB_TOKEN"]
  # - git-authors

